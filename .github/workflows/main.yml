name: Staticcheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  staticcheck:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22.4'

    - name: Install Staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest

    - name: Run Staticcheck
      run: staticcheck ./...
